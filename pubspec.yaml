name: expensewise
description: A production-quality Flutter personal expense tracker with offline-first functionality.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  
  # Navigation
  go_router: ^13.0.0
  
  # Database
  drift: ^2.14.0
  sqlite3_flutter_libs: ^0.5.0
  
  # Serialization
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  
  # UI
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.7
  intl: ^0.19.0
  
  # Charts
  fl_chart: ^0.65.0
  
  # Secure Storage
  flutter_secure_storage: ^9.0.0
  
  # Biometric
  local_auth: ^2.1.8
  
  # Notifications
  flutter_local_notifications: ^16.2.0
  timezone: ^0.9.2
  
  # OCR
  google_mlkit_text_recognition: ^0.13.0
  
  # Image Handling
  image_picker: ^1.0.4
  image: ^4.1.3
  
  # Camera (for receipt scanning)
  camera: ^0.10.5+5
  
  # Permissions
  permission_handler: ^11.4.4
  
  # Share/Export
  share_plus: ^7.2.1
  path_provider: ^2.1.1
  
  # File operations
  file_picker: ^6.1.1
  
  # PDF generation
  pdf: ^3.10.4
  printing: ^5.11.3
  
  # Extensions & Utilities
  equatable: ^2.0.5
  dartz: ^0.10.1
  
  # Logging
  logger: ^2.1.0
  
  # Time/Date
  jiffy: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^3.0.0
  
  # Code generation
  build_runner: ^2.4.6
  drift_dev: ^2.14.0
  freezed: ^2.4.1
  json_serializable: ^6.7.1
  
  # Testing
  mocktail: ^1.0.3
  bloc_test: ^9.1.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
  
  fonts:
    - family: GoogleSans
      fonts:
        - asset: assets/fonts/GoogleSans-Regular.ttf
        - asset: assets/fonts/GoogleSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/GoogleSans-Bold.ttf
          weight: 700
